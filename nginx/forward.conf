# Main server block
server {
    listen 8080;
    server_name _;  # Replace with your actual domain or use _ for any domain

    # Path to htpasswd file for authentication
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Reverse proxy to Quarkus application
    location / {
        proxy_pass http://quarkus:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User $remote_user;

        # Optional: Increase timeouts if needed
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}