services:

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    depends_on:
      - quarkus
    volumes:
      - ./nginx/forward.conf:/etc/nginx/conf.d/forward.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd

  quarkus:
    image: noauth/noauth:1.0-SNAPSHOT
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/quarkus_db
      QUARKUS_DATASOURCE_USERNAME: quarkus
      QUARKUS_DATASOURCE_PASSWORD: quarkus
      QUARKUS_PROFILE: noauth,nginx


  postgres:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_DB: quarkus_db
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "quarkus_app", "-U", "quarkus" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

