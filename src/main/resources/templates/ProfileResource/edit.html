{#include base.html}
{#title}Edit Profile - {profile.name}{/title}

{#content}
<div class="mb-8 flex items-center justify-between">
    <div>
        <h1 class="text-3xl font-bold text-white mb-2">Edit Profile</h1>
        <p class="text-slate-500">Update your account information.</p>
    </div>
    <a href="/profile/{profile.id}" class="text-slate-400 hover:text-white transition flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
        Back to Profile
    </a>
</div>

<div class="max-w-2xl">
    <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
        <form action="/profile/update/{profile.id}" method="POST" class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label for="name" class="block text-sm font-medium text-slate-400 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" value="{profile.name}" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
                </div>
                
                <div>
                    <label for="role" class="block text-sm font-medium text-slate-400 mb-2">Role</label>
                    <input disabled="disabled" type="text" id="role" name="role" value="{profile.role}"
                           class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-400 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" value="{profile.email}" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium text-slate-400 mb-2">Phone Number</label>
                    <input type="text" id="phone" name="phone" value="{profile.phone}" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <label for="address" class="block text-sm font-medium text-slate-400 mb-2">Physical Address</label>
                <textarea id="address" name="address" rows="3" 
                          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">{profile.address}</textarea>
            </div>

            <div class="pt-4 flex items-center gap-4">
                <button type="submit" 
                        class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition shadow-lg shadow-indigo-500/20">
                    Save Changes
                </button>
                <a href="/profile/{profile.id}" 
                   class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{/content}
{/include}
