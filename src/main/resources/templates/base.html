<!DOCTYPE html>
<html class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{#insert title}Quarkus App{/}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply text-slate-400;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 h-16 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-4">
            <a href="https://neuronaddict.org">
                <img src="/images/neuronaddict-logo.svg" alt="Quarkus Logo" class="h-12">
            </a>
            <span class="text-xl font-bold text-white">Dashboard</span>
        </div>
        {#if profile}
        <div class="text-slate-400 text-sm">
            hello <span class="text-white font-medium capitalize">{accessToken.name}</span>
        </div>
        {/if}
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Menu -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 overflow-y-auto hidden md:block">
            <nav class="p-4 space-y-2">
                <a href="#" class="block px-4 py-2 rounded-lg bg-indigo-600 text-white font-medium">Overview</a>
                <a href="#" class="block px-4 py-2 rounded-lg hover:bg-slate-800 hover:text-slate-200 transition">Reports</a>
                <a href="#" class="block px-4 py-2 rounded-lg hover:bg-slate-800 hover:text-slate-200 transition">Settings</a>
                <a href="#" class="block px-4 py-2 rounded-lg hover:bg-slate-800 hover:text-slate-200 transition">Profile</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-7xl mx-auto">
                {#insert content}
                <p>Default content if nothing is provided.</p>
                {/insert}
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-sm">
        <p>&copy; 2026 neuronaddict demo. Built with ❤️ on Quarkus.</p>
    </footer>
</body>
</html>
